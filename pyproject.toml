[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mooc-dropout-hypergraph"
version = "0.1.0"
description = "XuetangX dropout prediction with hypergraph structure learning"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "faiss-cpu>=1.13",
    "ijson>=3.3",
    "joblib>=1.4",
    "numpy>=2.0",
    "scipy>=1.14",
    "torch>=2.4",
]

[project.scripts]
xuetangx-hgsl = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "paths"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["data*", "features*", "hypergraph*", "models*", "losses*", "training*"]
