[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mooc-dropout-hypergraph"
version = "0.1.0"
description = "XuetangX dropout prediction with hypergraph structure learning"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "ijson>=3.3"]

[project.scripts]
mooc-hgsl = "mooc_hgsl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mooc_hgsl*"]
